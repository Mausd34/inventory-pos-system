<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory & POS</title><style>body{font-family:Inter,Arial;background:#f6f7fb;max-width:1000px;margin:40px auto;padding:20px}.cards{display:flex;gap:15px;flex-wrap:wrap}.card{background:white;padding:22px;border-radius:16px;min-width:180px;box-shadow:0 5px 20px #0001}button{padding:12px;border:0;border-radius:10px;cursor:pointer}</style></head><body><h1>Inventory & POS</h1><p>Sales and stock dashboard</p><div id="cards" class="cards"></div><button onclick="load()">Refresh</button><script>async function load(){let x=await(await fetch('/dashboard')).json();cards.innerHTML='<div class="card"><b>Products</b><h2>'+x.products+'</h2></div><div class="card"><b>Sales</b><h2>'+x.sales+'</h2></div><div class="card"><b>Revenue</b><h2>'+x.revenue+'</h2></div><div class="card"><b>Low Stock</b><h2>'+x.low_stock.length+'</h2></div>'}load()</script></body></html>
